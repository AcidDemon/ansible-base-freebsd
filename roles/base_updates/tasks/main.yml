---
- name: Deploy the unattended-update script
  ansible.builtin.copy:
    src: freebsd-auto-update.sh
    dest: /usr/local/sbin/freebsd-auto-update
    owner: root
    group: wheel
    mode: "0755"
  when: base_updates_enabled | bool

# periodic.conf is shared. Other layers write it too (e.g. hardening's
# daily_chkrootkit_enable), so edit per-key with sysrc rather than templating the file.
- name: Enable native periodic security reporting
  community.general.sysrc:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    path: /etc/periodic.conf
  loop:
    - { name: daily_status_security_enable, value: "YES" }
    - { name: security_status_pkgaudit_enable, value: "YES" }
    - { name: security_status_baseaudit_enable, value: "YES" }
    - { name: daily_status_security_inline, value: "NO" }
    # periodic(8) defines exit 0 as "produced nothing notable" and is built to
    # mask it, but the default prints it anyway - so a base security check that
    # found nothing contributes a heading with no body, which reads as a check
    # that broke rather than one that passed. 999.clean-note says it in words.
    - { name: security_show_success, value: "NO" }
    # Not daily_show_success: the daily run's exit-0 scripts include df -h,
    # zpool list and netstat -i, which are worth reading. Only these three
    # cleaners are noise - vi recovery files, msgs(1) announcements and rwhod
    # are all vestigial, and each prints a bare heading every night.
    - { name: daily_clean_preserve_enable, value: "NO" }
    - { name: daily_clean_msgs_enable, value: "NO" }
    - { name: daily_clean_rwho_enable, value: "NO" }
  loop_control:
    label: "{{ item.name }}"
  when: base_updates_enabled | bool

# Not left to a later layer: base runs first, and the drop-in below has to land
# somewhere that already exists.
- name: Ensure the local periodic/security dir exists
  ansible.builtin.file:
    path: /usr/local/etc/periodic/security
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  when: base_updates_enabled | bool

- name: Deploy the periodic security footer
  ansible.builtin.copy:
    src: 999.clean-note
    dest: /usr/local/etc/periodic/security/999.clean-note
    owner: root
    group: wheel
    mode: "0755"
  when: base_updates_enabled | bool

- name: Schedule the unattended update run
  ansible.builtin.cron:
    name: freebsd-auto-update
    user: root
    minute: "{{ base_updates_cron.minute }}"
    hour: "{{ base_updates_cron.hour }}"
    weekday: "{{ base_updates_cron.weekday }}"
    job: "/usr/local/sbin/freebsd-auto-update"
    state: "{{ 'present' if base_updates_enabled | bool else 'absent' }}"

- name: Lock held packages (never auto-upgraded)
  community.general.pkgng:
    name: "{{ base_updates_hold_packages }}"
    state: present
  when: base_updates_hold_packages | length > 0

- name: Apply pkg lock on held packages
  ansible.builtin.command: "pkg lock -y {{ item }}"
  register: _pkg_lock
  changed_when: "'already locked' not in _pkg_lock.stdout"
  loop: "{{ base_updates_hold_packages }}"
  when: base_updates_hold_packages | length > 0
