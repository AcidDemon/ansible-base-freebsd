# ~/.tmux.conf

# Better terminal defaults (with RGB if available)
if-shell 'infocmp -x tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
set -as terminal-overrides ',*:RGB'

# Responsiveness + history
set -g escape-time 10
set -g history-limit 100000
set -g status-interval 5

# Indexing (1-based)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse + sane copy-mode (vi-style)
set -g mouse on
setw -g mode-keys vi

# Splits and navigation
bind | split-window -h
bind - split-window -v
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize with Shift+arrows
bind -r Left  resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up    resize-pane -U 2
bind -r Down  resize-pane -D 2

# Quick reload
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

# Quiet, readable styling
set -g status on
set -g status-style 'bg=colour234,fg=colour248'
set -g message-style 'bg=colour235,fg=colour252'
set -g pane-border-style 'fg=colour238'
set -g pane-active-border-style 'fg=colour39'

# Window list styling
setw -g window-status-style 'fg=colour244,bg=colour234'
setw -g window-status-current-style 'fg=colour234,bg=colour39'
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format ' #I:#W '

# Left: session + windows
set -g status-left-length 40
set -g status-left '#[fg=colour39,bold] #S #[fg=colour244]│'

# Right: host/ip/load/mem/uptime/time via helper script, falls back to built-ins
set -g status-right-length 140
set -g status-right '#(test -x ~/.local/bin/tmux-status && ~/.local/bin/tmux-status || echo "#H | %Y-%m-%d %H:%M") '

# Keep window titles stable on servers
set -g allow-rename off
setw -g automatic-rename off
